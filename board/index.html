<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dvoechnik — Chess Board</title>
  <style>
    :root { --light:#f0d9b5; --dark:#b58863; --ink:#202124; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#171717; color:#f5f5f5; font-family:system-ui,sans-serif; }
    main { width:min(92vw,700px); }
    h1 { margin:0 0 .25rem; font-size:clamp(2rem,6vw,3.5rem); letter-spacing:-.05em; }
    p { margin:.25rem 0 1.2rem; color:#bdbdbd; }
    #board { display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1; border:8px solid #292929; box-shadow:0 20px 70px #0008; }
    .square { display:grid; place-items:center; aspect-ratio:1; font-size:clamp(1.8rem,8vw,4.3rem); cursor:pointer; user-select:none; }
    .light { background:var(--light); } .dark { background:var(--dark); }
    .selected { outline:5px solid #ffcf33; outline-offset:-5px; }
    .hint { box-shadow:inset 0 0 0 999px #8bc34a55; }
    #status { margin-top:1rem; padding:.75rem 1rem; background:#242424; border-radius:10px; }
    button { margin-top:.8rem; padding:.65rem 1rem; border:0; border-radius:8px; cursor:pointer; font-weight:700; }
  </style>
</head>
<body>
<main>
  <h1>Dvoechnik</h1>
  <p>Board preview. For now it can only select pieces — like a real agent before training.</p>
  <div id="board" aria-label="Шахматная доска"></div>
  <div id="status">Select a piece.</div>
  <button id="reset">Reset position</button>
</main>
<script>
const glyph = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟', K:'♔', Q:'♕', R:'♖', B:'♗', N:'♘', P:'♙' };
const start = ['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'];
let position = start.map(row => row.split('')), selected = null;
const board = document.querySelector('#board'), status = document.querySelector('#status');
function draw() { board.innerHTML=''; position.forEach((row,r)=>row.forEach((piece,c)=>{
  const cell=document.createElement('div'); cell.className=`square ${(r+c)%2?'dark':'light'}`;
  if (selected && selected[0]===r && selected[1]===c) cell.classList.add('selected');
  if (selected && !piece && Math.abs(selected[0]-r)<=1 && Math.abs(selected[1]-c)<=1) cell.classList.add('hint');
  cell.textContent=glyph[piece]||''; cell.onclick=()=>click(r,c); board.append(cell);
})); }
function click(r,c) { if (position[r][c]) { selected=[r,c]; status.textContent=`Selected ${String.fromCharCode(97+c)}${8-r}. Move legality is still being studied.`; } else if(selected) { position[r][c]=position[selected[0]][selected[1]]; position[selected[0]][selected[1]]='.'; selected=null; status.textContent='Move made. Dvoechnik does not enforce rules yet.'; } draw(); }
document.querySelector('#reset').onclick=()=>{ position=start.map(row=>row.split('')); selected=null; status.textContent='Select a piece.'; draw(); };
draw();
</script>
</body>
</html>

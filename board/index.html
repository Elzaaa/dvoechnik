<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dvoechnik — Chess Board</title>
  <style>
    :root { --light:#dbeafe; --dark:#5b8db8; --panel:#202b38; --blue:#4aa3df; --blue-dark:#2878ad; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#3c3a37,#161513 65%); color:#f5f5f5; font-family:system-ui,-apple-system,sans-serif; }
    main { width:min(94vw,760px); padding:1.5rem; }
    header { display:flex; align-items:end; justify-content:space-between; gap:1rem; margin:0 0 1rem; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3.5rem); letter-spacing:-.06em; }
    .badge { padding:.35rem .65rem; border-radius:999px; background:#3b3936; color:#c9c7c4; font-size:.8rem; font-weight:700; }
    p { margin:.25rem 0 1.2rem; color:#c9c7c4; }
    #board { display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1; overflow:hidden; border-radius:8px; box-shadow:0 14px 35px #0008,0 2px 0 #ffffff1a inset; }
    .square { display:grid; place-items:center; aspect-ratio:1; font-size:clamp(1.8rem,8vw,4.3rem); cursor:pointer; user-select:none; text-shadow:0 2px 2px #0005; }
    .light { background:var(--light); } .dark { background:var(--dark); }
    .selected { outline:5px solid #ffcf33; outline-offset:-5px; }
    .hint { box-shadow:inset 0 0 0 999px #8bc34a55; }
    #status { margin-top:1rem; padding:.85rem 1rem; background:var(--panel); border-radius:8px; color:#ddd; }
    button { margin-top:.8rem; padding:.7rem 1.1rem; border:0; border-radius:6px; background:var(--blue); color:#fff; cursor:pointer; font-weight:800; box-shadow:0 3px 0 var(--blue-dark); }
    button:hover { background:#69b8eb; }
  </style>
</head>
<body>
<main>
  <header><h1>Dvoechnik</h1><span class="badge">LEARNING FROM ZERO</span></header>
  <p>Board preview. For now it can only select pieces — like a real agent before training.</p>
  <div id="board" aria-label="Шахматная доска"></div>
  <div id="status">Select a piece.</div>
  <button id="reset">Reset position</button>
</main>
<script>
const glyph = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟', K:'♔', Q:'♕', R:'♖', B:'♗', N:'♘', P:'♙' };
const start = ['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'];
let position = start.map(row => row.split('')), selected = null;
const board = document.querySelector('#board'), status = document.querySelector('#status');
function draw() { board.innerHTML=''; position.forEach((row,r)=>row.forEach((piece,c)=>{
  const cell=document.createElement('div'); cell.className=`square ${(r+c)%2?'dark':'light'}`;
  if (selected && selected[0]===r && selected[1]===c) cell.classList.add('selected');
  if (selected && !piece && Math.abs(selected[0]-r)<=1 && Math.abs(selected[1]-c)<=1) cell.classList.add('hint');
  cell.textContent=glyph[piece]||''; cell.onclick=()=>click(r,c); board.append(cell);
})); }
function click(r,c) { if (position[r][c]) { selected=[r,c]; status.textContent=`Selected ${String.fromCharCode(97+c)}${8-r}. Move legality is still being studied.`; } else if(selected) { position[r][c]=position[selected[0]][selected[1]]; position[selected[0]][selected[1]]='.'; selected=null; status.textContent='Move made. Dvoechnik does not enforce rules yet.'; } draw(); }
document.querySelector('#reset').onclick=()=>{ position=start.map(row=>row.split('')); selected=null; status.textContent='Select a piece.'; draw(); };
draw();
</script>
</body>
</html>
